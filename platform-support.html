<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business One Support Desk</title>
    <link rel="stylesheet" href="css/platform-support.css">
</head>
<body>
    <div class="page-shell">
        <header class="desk-header">
            <div>
                <h1 id="desk-title">Business One Support Desk</h1>
                <p>Remote assistance queue for merchant POS registers</p>
            </div>
            <div class="desk-actions">
                <a id="support-desk-local-link" href="/support-desk" class="btn btn-secondary">Open hub URL</a>
            </div>
        </header>

        <section id="login-screen" class="card">
            <h2 class="section-title">Technician sign in</h2>
            <p id="login-tech-hint" class="hint">Sign in with your Business One support desk account.</p>

            <div class="form-grid" style="max-width: 420px; margin-top: 1rem;">
                <div>
                    <label for="hub-url">Support hub server URL</label>
                    <input id="hub-url" type="url" placeholder="https://support.yourbusinessone.com" autocomplete="url">
                    <p id="hub-url-warning" class="error-text hidden"></p>
                </div>
                <div>
                    <label for="login-email">Email</label>
                    <input id="login-email" type="email" autocomplete="username">
                </div>
                <div>
                    <label for="login-password">Password</label>
                    <input id="login-password" type="password" autocomplete="current-password">
                </div>
                <p id="login-error" class="error-text"></p>
                <div class="desk-actions">
                    <button type="button" class="btn btn-primary" id="login-btn">Sign in</button>
                    <span id="google-login-wrap">
                        <button type="button" class="btn btn-secondary hidden" id="google-login-btn">Sign in with Google</button>
                    </span>
                </div>
            </div>
        </section>

        <section id="queue-app" class="hidden">
            <div class="desk-header" style="margin-bottom: 1rem;">
                <p id="signed-in-as" class="hint"></p>
                <div class="desk-actions">
                    <button type="button" class="btn btn-secondary" id="notify-btn">Enable alerts</button>
                    <button type="button" class="btn btn-secondary" id="reload-btn">Refresh</button>
                    <button type="button" class="btn btn-ghost" id="logout-btn">Sign out</button>
                </div>
            </div>

            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Waiting</div>
                    <div class="stat-value" id="stat-waiting">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">In progress</div>
                    <div class="stat-value" id="stat-progress">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Active queue</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>
            </div>

            <p id="status-msg" class="hint"></p>

            <div class="card">
                <h2 class="section-title">Waiting for technician</h2>
                <div id="waiting-list"></div>
            </div>

            <div class="card">
                <h2 class="section-title">In progress</h2>
                <div id="progress-list"></div>
            </div>
        </section>
    </div>

    <script src="platform-support.js"></script>
</body>
</html>
